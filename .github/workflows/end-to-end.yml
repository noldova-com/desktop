name: End-to-end specs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  versions:
    name: Versions
    if: github.ref == 'refs/heads/main'
    uses: noldova-com/.github/.github/workflows/versions.yml@43df1a5296a892a1ed162a02ca2af77902d19bb8 # v2.51.2
    permissions: {}

  end-to-end:
    name: End-to-end specs
    needs: versions
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/end-to-end-specs.yml
    permissions:
      contents: read
    with:
      targets: ${{ format('[{0}"target":"Linux x64","system":"linux","runner":{1}{2},{0}"target":"Windows x64","system":"windows","runner":{3}{2}]', '{', toJSON(needs.versions.outputs.runs-on-linux-x64), '}', toJSON(needs.versions.outputs.runs-on-windows-x64)) }}

  report:
    name: Report a failing run
    needs: [versions, end-to-end]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Take the failed specs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: end-to-end-*
          path: ${{ runner.temp }}/end-to-end

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The end-to-end specs fail on main
          ARTIFACTS: ${{ runner.temp }}/end-to-end
          BODY: ${{ runner.temp }}/end-to-end-issue.md
        run: |
          {
            echo "The run $RUN_URL failed; its artifacts hold each target's report and results."
            for list in "$ARTIFACTS"/end-to-end-*/failed/*.md; do
              [ -f "$list" ] || continue
              echo
              cat "$list"
            done
          } > "$BODY"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$BODY"
          else
            url=$(gh issue create --title "$TITLE" --body-file "$BODY")
            gh api -X PATCH "repos/$GH_REPO/issues/${url##*/}" -f type=Bug > /dev/null
          fi

  foundation-range:
    name: Newest context and kit in the window package's ranges
    needs: versions
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      chosen: ${{ steps.choose.outputs.chosen }}
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Choose the newest context and kit inside the ranges
        id: choose
        run: |
          node --input-type=module <<'SCRIPT'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync } from "node:fs";

          const file = "src/noldova.desktop.window/package.json";
          const peers = JSON.parse(readFileSync(file, "utf8")).peerDependencies ?? {};
          const isVersion = text => /^\d+\.\d+\.\d+$/.test(text);
          const compare = (left, right) => left.split(".").map(Number).reduce((found, part, index) => found || part - Number(right.split(".")[index]), 0);
          const chosen = {};
          for (const name of ["@noldova/context.core", "@noldova/context.exceptions", "@noldova/context.json", "@noldova/ui.components.angular"]) {
            const range = peers[name];
            const match = /^>=(\S+) <(\S+)$/.exec(typeof range === "string" ? range : "");
            if (match === null || !isVersion(match[1]) || !isVersion(match[2])) {
              console.log(`::error::${file} names ${name} ${JSON.stringify(range ?? null)}, not a range of the form >=<lowest version> <first version refused>.`);
              process.exit(1);
            }
            const text = execFileSync("npm", ["view", name, "versions", "--json"], { encoding: "utf8" }).trim();
            const inside = [text === "" ? [] : JSON.parse(text)].flat().filter(t => isVersion(t) && compare(t, match[1]) >= 0 && compare(t, match[2]) < 0).sort(compare);
            if (inside.length === 0) {
              console.log(`::error::No published ${name} version is inside the window package's range ${range}.`);
              process.exit(1);
            }
            chosen[name] = inside.at(-1);
            console.log(`The range ${range} holds ${inside.length} published ${name} versions; the newest is ${chosen[name]}.`);
          }
          chosen["@noldova/context.testing"] = chosen["@noldova/context.core"];
          chosen["@noldova/context.text"] = chosen["@noldova/context.core"];
          appendFileSync(process.env.GITHUB_OUTPUT, `chosen=${Object.entries(chosen).map(([name, version]) => `${name}@${version}`).join(" ")}\n`);
          SCRIPT

      - name: Move to the chosen versions
        env:
          CHOSEN: ${{ steps.choose.outputs.chosen }}
        run: |
          node --input-type=module <<'SCRIPT'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";

          const chosen = new Map(process.env.CHOSEN.split(" ").map(t => [t.slice(0, t.lastIndexOf("@")), t.slice(t.lastIndexOf("@") + 1)]));
          const files = execFileSync("git", ["ls-files", "package.json", "**/package.json"], { encoding: "utf8" }).split("\n").filter(t => t !== "");
          for (const file of files) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            const moved = ["dependencies", "devDependencies"].flatMap(field => Object.keys(manifest[field] ?? {}).filter(t => chosen.has(t)).map(t => {
              manifest[field][t] = chosen.get(t);
              return `${t}@${chosen.get(t)}`;
            }));
            if (moved.length > 0) {
              writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
              console.log(`${file}: ${moved.join(" ")}`);
            }
          }
          SCRIPT
          npm install --ignore-scripts --no-audit --no-fund

      - name: Install the app's packages and the browser for the Angular tests as the build does
        timeout-minutes: 10
        env:
          npm_config_ignore_scripts: 'true'
        run: npm run build:install

      - name: Install Electron
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Electron's binary download failed (attempt $attempt of 4); trying again in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Electron's binary could not be downloaded in 4 attempts."
          exit 1

      - name: Build
        env:
          npm_config_ignore_scripts: 'true'
          ELECTRON_MIRROR: https://download.invalid/
          PLAYWRIGHT_DOWNLOAD_HOST: https://download.invalid
        run: npm run build

      - name: Check the installed versions
        env:
          CHOSEN: ${{ steps.choose.outputs.chosen }}
        run: |
          node --input-type=module <<'SCRIPT'
          import { readFileSync } from "node:fs";

          for (const move of process.env.CHOSEN.split(" ")) {
            const at = move.lastIndexOf("@");
            const [name, version] = [move.slice(0, at), move.slice(at + 1)];
            const file = `node_modules/${name}/package.json`;
            const installed = JSON.parse(readFileSync(file, "utf8")).version;
            if (installed !== version) {
              console.log(`::error::${file} holds ${name} ${installed}, not the chosen ${version}.`);
              process.exit(1);
            }
            console.log(`${file} holds ${name} ${installed}.`);
          }
          SCRIPT

      - name: Test
        env:
          npm_config_ignore_scripts: 'true'
        run: npm test

  foundation-range-report:
    name: Report a failing range run
    needs: [versions, foundation-range]
    if: failure() && github.event_name == 'schedule'
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHOSEN: ${{ needs.foundation-range.outputs.chosen }}
          TITLE: Noldova Desktop fails on the newest context or kit in its window package's ranges
          BODY: ${{ runner.temp }}/foundation-range-issue.md
        run: |
          {
            if [ -n "$CHOSEN" ]; then
              echo "The nightly run $RUN_URL built and tested Noldova Desktop with $CHOSEN, the newest published versions inside the window package's ranges, and it failed."
            else
              echo "The nightly run $RUN_URL could not choose versions from the window package's ranges; its log says why."
            fi
          } > "$BODY"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$BODY"
          else
            url=$(gh issue create --title "$TITLE" --body-file "$BODY")
            gh api -X PATCH "repos/$GH_REPO/issues/${url##*/}" -f type=Bug > /dev/null
          fi
