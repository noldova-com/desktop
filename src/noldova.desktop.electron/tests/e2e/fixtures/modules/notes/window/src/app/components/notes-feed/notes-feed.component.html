<nol-virtual-list class="nol-notes-feed-list" [kind]="kinds.Feed" label="Messages" [source]="messages">
  <ng-template [nolVirtualRow]="messages" let-message let-labelId="labelId">
    <nol-message [author]="message.author" [time]="message.time" [blocks]="message.blocks" [status]="complete" [key]="message.key" [labelId]="labelId" />
  </ng-template>
</nol-virtual-list>
