<button type="button" class="nol-window-controls-button nol-window-controls-minimize" [attr.aria-label]="resources.minimizeWindowLabel" [nolTooltip]="resources.minimizeWindowLabel"
  [nolTooltipSide]="below" (click)="minimize()">
  <svg class="nol-window-controls-glyph" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5H10" /></svg>
</button>
@let maximizedLabel = isMaximized() ? resources.restoreWindowLabel : resources.maximizeWindowLabel;
<button type="button" class="nol-window-controls-button nol-window-controls-maximize" [attr.aria-label]="maximizedLabel" [nolTooltip]="maximizedLabel" [nolTooltipSide]="below"
  (click)="toggleMaximized()">
  @if (isMaximized()) {
    <svg class="nol-window-controls-glyph nol-window-controls-restore-glyph" viewBox="0 0 10 10" aria-hidden="true">
      <rect x="0.5" y="2.5" width="7" height="7" rx="1" />
      <path d="M2.5 2.5V1.5A1 1 0 0 1 3.5 0.5H7.5A2 2 0 0 1 9.5 2.5V6.5A1 1 0 0 1 8.5 7.5H7.5" />
    </svg>
  } @else {
    <svg class="nol-window-controls-glyph nol-window-controls-maximize-glyph" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1" /></svg>
  }
</button>
<button type="button" class="nol-window-controls-button nol-window-controls-close" [attr.aria-label]="resources.closeWindowLabel" [nolTooltip]="resources.closeWindowLabel"
  [nolTooltipSide]="below" (click)="close()">
  <svg class="nol-window-controls-glyph" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0L10 10M10 0L0 10" /></svg>
</button>
