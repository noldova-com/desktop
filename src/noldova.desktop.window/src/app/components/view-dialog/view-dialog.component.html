@if (dialogs.shown(); as tab) {
  <nol-dialog [title]="labels.of(tab).title" [size]="large" (dismissed)="dialogs.close()">
    <button type="button" nol-icon-button nolDialogControl class="nol-view-dialog-open" [icon]="resources.openInMainWindowGlyph" [label]="resources.openInMainWindowLabel"
      [nolTooltip]="resources.openInMainWindowLabel" (click)="dialogs.openInMainWindow(tab)"></button>
    <nol-tab-slot class="nol-view-dialog-content" [tab]="tab" />
  </nol-dialog>
}
