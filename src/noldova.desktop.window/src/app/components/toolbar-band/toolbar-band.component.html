@if (hasAnyContent()) {
  <nol-place-menu #list [place]="resources.toolbarsMenu" [context]="menuContext()" />
  <ng-template #rows>
    @for (row of bandRows(); track $index; let rowIndex = $index) {
      @if (hasContent(row)) {
        <div class="nol-toolbar-row" [attr.data-toolbar-row]="rowIndex">
          @for (toolbar of row; track toolbar.name; let index = $index) {
            @if (toolbar.sections.length > 0) {
              <nol-toolbar [toolbar]="toolbar" [attr.data-toolbar-index]="index" />
            }
          }
        </div>
      }
    }
  </ng-template>
  <div #band class="nol-toolbar-band" [nolContextMenuTriggerFor]="list.menu()">
    <ng-container [ngTemplateOutlet]="rows" />
  </div>
  @if (isDropHere() ? drag.target() : null; as target) {
    <div class="nol-toolbar-drop nol-drop-line" [class.nol-drop-line-row]="target.isNewRow" [style.left.px]="target.x" [style.top.px]="target.y"
      [style.width.px]="target.isNewRow ? target.rowWidth : null"></div>
  }
}
