@if (failure(); as failure) {
  <nol-module-failure-card [failure]="failure" />
} @else if (loaded(); as type) {
  <ng-container *ngComponentOutlet="type; injector: pageInjector()" />
} @else {
  <nol-spinner [label]="resources.settingsPageLoading" [isDelayed]="true" />
}
