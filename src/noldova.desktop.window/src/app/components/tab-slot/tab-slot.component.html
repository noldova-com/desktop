@if (isStopped()) {
  <div class="nol-tab-slot-stopped" role="status">
    <span class="nol-tab-slot-stopped-text" data-truncates [nolTooltip]="resources.agentsStoppedLabel" [nolTooltipTruncated]="true">{{ resources.agentsStoppedLabel }}</span>
    <button type="button" nol-button [variant]="secondary" (click)="resume()">{{ resources.resumeAgentsLabel }}</button>
  </div>
}
